<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#121513" media="(prefers-color-scheme: dark)">
<title>주차 등록 · 대구무형유산전수교육관</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4efe6;--paper2:#fbf8f2;--ink:#1c201e;--ink2:#4a524e;--mute:#8a8f8a;--line:#e2d9c9;--jade:#1f5c4a;--jade2:#2b7a62;--cinna:#b23a2b;--ochre:#c9962e;--indigo:#2f4f7a;--okbg:#e6f2ec;--ok:#1f6b47;--badbg:#f8e7e3;--bad:#9b2a1d;--plate:#ffffff;--shadow:0 1px 2px rgba(40,30,10,.06),0 8px 24px rgba(40,30,10,.07)}
@media (prefers-color-scheme:dark){:root{--paper:#121513;--paper2:#1a1e1c;--ink:#ecebe6;--ink2:#c4c7c2;--mute:#8d938e;--line:#2c322f;--jade:#4fae8e;--jade2:#64c2a2;--cinna:#e07a68;--ochre:#e0b453;--okbg:#16302a;--ok:#7fd4ad;--badbg:#3a1e1a;--bad:#ff9d8e;--plate:#202523;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--paper);color:var(--ink);font:16px/1.6 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;word-break:keep-all;
 background-image:radial-gradient(rgba(120,95,50,.05) 1px,transparent 1px);background-size:5px 5px}
.dan{height:8px;background:repeating-linear-gradient(90deg,var(--cinna) 0 18px,var(--jade) 18px 36px,var(--ochre) 36px 54px,var(--indigo) 54px 72px,#efe6d6 72px 90px)}
.page{max-width:480px;margin:0 auto;padding:22px 20px calc(120px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:13px;letter-spacing:.02em}
.seal{width:30px;height:30px;border-radius:7px;background:var(--cinna);color:#fff;display:grid;place-items:center;font:700 15px/1 "Noto Serif KR",serif;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.hello{margin:30px 0 22px}
.hello .hi{margin:0;font-size:17px;color:var(--ink2)}
.hello h1{margin:6px 0 10px;font:700 28px/1.35 "Noto Serif KR",serif;letter-spacing:-.01em}
.hello h1 .who{color:var(--jade)}
.hello .lead{margin:0;font-size:17px;color:var(--ink2)}
.today{display:inline-flex;gap:8px;align-items:center;margin-top:14px;padding:7px 12px;border-radius:999px;background:var(--paper2);border:1px solid var(--line);font-size:13px;color:var(--ink2)}
.today i{width:7px;height:7px;border-radius:50%;background:var(--jade2);display:inline-block}
.sheet{background:var(--paper2);border:1px solid var(--line);border-radius:22px;padding:20px 18px 18px;box-shadow:var(--shadow)}
.sheet h2{margin:0 0 4px;font-size:16px}
.sheet .hint{margin:0 0 14px;font-size:13px;color:var(--mute)}
.plates{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pl{position:relative;min-width:0;display:flex;align-items:center;background:var(--plate);border:1.5px solid var(--line);border-radius:12px;padding:0 10px 0 0;transition:border-color .15s,box-shadow .15s}
.pl:focus-within{border-color:var(--jade);box-shadow:0 0 0 4px rgba(31,92,74,.12)}
.pl .no{flex:none;width:30px;align-self:stretch;display:grid;place-items:center;font-size:11px;color:var(--mute);border-right:1px dashed var(--line);margin-right:4px}
.pl input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:700 26px/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.18em;text-align:center;padding:14px 0;outline:none}
.pl input::placeholder{color:var(--line);letter-spacing:.18em}
.pl.mine::after{content:"지난번";position:absolute;top:-8px;right:8px;font-size:10px;font-weight:700;color:var(--jade);background:var(--paper2);padding:0 5px;border-radius:4px}
.pl.done{border-color:var(--ok);background:var(--okbg)}.pl.fail{border-color:var(--bad);background:var(--badbg)}
.err{margin:12px 0 0;padding:11px 13px;border-radius:12px;background:var(--badbg);color:var(--bad);font-size:14px}
.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--paper) 70%,transparent)}
.cta button{display:block;width:100%;max-width:440px;margin:0 auto;border:0;border-radius:16px;padding:18px;font-size:18px;font-weight:700;line-height:1;font-family:inherit;color:#fff;background:var(--jade);box-shadow:0 6px 18px rgba(31,92,74,.28);cursor:pointer;transition:transform .08s,opacity .15s}
.cta button:active{transform:scale(.985)}.cta button:disabled{opacity:.6}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;vertical-align:-3px;margin-right:8px;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.loc{margin:12px 2px 0;font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
details.note{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;color:var(--ink2);font-size:14px}
details.note summary{cursor:pointer;color:var(--ink2);font-weight:600;list-style:none}details.note summary::-webkit-details-marker{display:none}
details.note summary::after{content:" ▾";color:var(--mute)}details.note[open] summary::after{content:" ▴"}
details.note p{white-space:pre-wrap;margin:10px 0 0}
/* 결과 */
.result{text-align:center;padding:10px 0 4px}
.badge{width:76px;height:76px;margin:6px auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--okbg);color:var(--ok);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.badge.warn{background:var(--badbg);color:var(--bad)}
.badge svg{width:38px;height:38px}
.badge path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s .15s ease forwards}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}@keyframes draw{to{stroke-dashoffset:0}}
.result h2{margin:0 0 4px;font:700 24px/1.35 "Noto Serif KR",serif}
.result .lead{margin:0 0 18px;color:var(--ink2)}
.rows{list-style:none;margin:0;padding:0;text-align:left}
.rows li{display:flex;align-items:center;gap:12px;padding:13px 2px;border-top:1px solid var(--line)}
.rows .num{font:700 19px/1.2 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.04em;min-width:7.2em}
.rows .txt{flex:1;font-size:14px;color:var(--ink2)}.rows .txt small{display:block;color:var(--mute);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}.dot.ok{background:var(--ok)}.dot.no{background:var(--bad)}.dot.pick{background:var(--ochre)}
.picks{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.picks button{border:1.5px solid var(--line);background:var(--plate);color:var(--ink);border-radius:10px;padding:8px 12px;font:700 16px/1 ui-monospace,Menlo,monospace;cursor:pointer}
.again{margin-top:16px;background:none;border:0;color:var(--jade);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;padding:8px}
.empty h1{font-size:24px}
.skel{height:18px;border-radius:8px;background:linear-gradient(90deg,var(--line),var(--paper2),var(--line));background-size:200% 100%;animation:sh 1.2s infinite;margin:10px 0}@keyframes sh{to{background-position:-200% 0}}
</style></head><body>
<div class="dan"></div>
<main class="page" id="app">
  <div class="brand"><span class="seal">傳</span>대구무형유산전수교육관 · 주차 등록</div>
  <div class="hello"><div class="skel" style="width:40%"></div><div class="skel" style="width:80%;height:30px"></div><div class="skel" style="width:60%"></div></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const BANG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 6v8M12 18h.01"/></svg>';
const API="https://alluyuuliogbkvrwagrl.supabase.co/functions/v1/parking";
// 개인 QR 주소의 #k=열쇠 를 이 휴대폰에 기억해 둔다 (다음엔 주소만 열어도 알아봄)
const KEY=(()=>{const m=location.hash.match(/k=([\w-]+)/);let k=m?m[1]:'';try{if(k)localStorage.setItem('pq_key',k);else k=localStorage.getItem('pq_key')||''}catch(e){}return k})();
const H=KEY?{'X-Key':KEY}:{};
const BRAND='<div class="brand"><span class="seal">傳</span>대구무형유산전수교육관 · 주차 등록</div>';
let me=null;
async function load(){try{const r=await fetch(API+'/me',{cache:'no-store',headers:H});me=await r.json();form()}catch(e){$('#app').innerHTML=BRAND+'<div class="hello"><h1>연결이 불안정해요</h1><p class="lead">잠시 뒤 다시 QR을 찍어 주세요.</p></div>'}}
function note(){return '<details class="note"><summary>주차 안내</summary><p>'+esc(me.notice)+'</p></details>'}
function form(){
  if(!me.enrolled){
    $('#app').innerHTML=BRAND+'<div class="hello empty"><p class="hi">안녕하세요?</p><h1>등록된 휴대폰이 아니에요</h1><p class="lead">주차 등록은 사무실에 미리 등록한 휴대폰으로만 할 수 있어요.</p></div><div class="sheet"><h2>처음이시거나 휴대폰을 바꾸셨나요?</h2><p class="hint" style="margin:6px 0 0">사무실에서 <b>휴대폰 등록 QR</b>을 받아 한 번만 찍어 주세요.'+(me.contact?'<br>'+esc(me.contact):'')+'</p>'+note()+'</div>';
    document.body.classList.add('no-cta');return;
  }
  const p=me.person,n=me.maxPerSubmit;
  const mine=[...new Set(p.plates.slice().reverse().map(x=>x.slice(-4)))].slice(0,n);
  let boxes='';for(let i=0;i<n;i++)boxes+='<label class="pl'+(mine[i]?' mine':'')+'"><span class="no">'+(i+1)+'</span><input inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="0000" value="'+esc(mine[i]||'')+'" aria-label="차량 뒷번호 4자리 '+(i+1)+'번"></label>';
  const fld=(p.field||'').replace(/[()]/g,' ').replace(/s+/g,' ').trim();
  const who=p.national?'<span style="color:var(--ink2);font-size:.72em;display:block">국가무형유산</span>'+esc(fld)+' '+esc(p.name):[p.name,fld,p.role].filter(Boolean).map(esc).join(' ');
  const hon=p.honor==='님'?'님':' '+esc(p.honor);
  const cls=me.classes.length?'<div class="today"><i></i>오늘 '+me.classes.map(c=>esc(c.name)+' '+esc(c.start)+'–'+esc(c.end)).join(' · ')+'</div>':'';
  $('#app').innerHTML=BRAND
   +'<section class="hello"><p class="hi">안녕하세요?</p><h1><span class="who">'+who+'</span>'+hon+',</h1><p class="lead">주차등록을 도와드리겠습니다.</p>'+cls+'</section>'
   +'<section class="sheet"><h2>차량 뒷번호 4자리</h2><p class="hint">한 번에 '+n+'대까지 등록 가능합니다. 입차한 차량만 등록 가능합니다.</p><div class="plates">'+boxes+'</div><div id="err"></div>'
   +(me.locationCheck?'<p class="loc">📍 등록할 때 위치를 한 번 확인해요</p>':'')+note()+'</section>'
   +'<div class="cta"><button id="go">주차 등록하기</button></div>';
  const ins=[...document.querySelectorAll('.pl input')];
  ins.forEach((i,k)=>i.oninput=()=>{i.value=i.value.replace(/\D/g,'').slice(0,4);if(i.value.length===4){const nx=ins.slice(k+1).find(x=>!x.value);if(nx)nx.focus();else i.blur()}});
  $('#go').onclick=()=>go(ins.map(i=>i.value.trim()).filter(Boolean));
}
function err(t){const e=$('#err');if(e)e.innerHTML=t?'<div class="err">'+esc(t)+'</div>':''}
function where(){return new Promise(res=>{if(!me.locationCheck||!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lng:p.coords.longitude,accuracy:p.coords.accuracy}),()=>res(null),{enableHighAccuracy:true,timeout:12000,maximumAge:60000})})}
function busy(t){const b=$('#go');if(!b)return;b.disabled=!!t;b.innerHTML=t?'<span class="spin"></span>'+t:'주차 등록하기'}
async function go(inputs){
  if(!inputs.length)return err('차량 뒷번호 4자리를 넣어 주세요.');
  const bad=inputs.filter(x=>!/^\d{4}$/.test(x)&&x.length<7);
  if(bad.length)return err('뒷번호는 숫자 4자리로 넣어 주세요.');
  err('');busy('위치 확인 중');
  const pos=await where();
  if(me.locationCheck&&!pos){busy('');return err('위치를 확인할 수 없어요. 휴대폰 설정에서 이 브라우저의 위치 권한을 허용하고 다시 눌러 주세요.')}
  busy('등록하는 중');
  try{
    const r=await fetch(API+'/register',{method:'POST',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({inputs,pos})});
    const j=await r.json();busy('');
    if(!j.ok)return err(j.message||'등록하지 못했어요.');
    result(j.results);
  }catch(e){busy('');err('연결이 불안정해요. 잠시 뒤 다시 눌러 주세요.')}
}
function result(rs){
  const good=r=>r.status==='registered'||r.status==='already';
  const ok=rs.filter(good).length,all=ok===rs.length,picks=rs.some(r=>r.status==='choose');
  const head=all?'주차 등록이 되었습니다':ok?ok+'대 등록되었습니다':picks?'차량을 골라 주세요':'입차된 차량이 없습니다';
  const lead=all?'2시간 무료가 적용되었어요. 편안한 수업 되세요.':ok?'등록되지 않은 차량을 확인해 주세요.':picks?'같은 뒷번호 차량이 여러 대 있어요.':'차를 주차장에 세운 뒤 다시 등록해 주세요.';
  const rows=rs.map(r=>{
    const g=good(r),c=r.status==='choose';
    const t=g?(r.status==='already'?'이미 등록된 차량입니다':'주차 등록 완료'):r.status==='not_entered'?'입차된 차량이 없습니다':c?'내 차를 골라 주세요':(r.message||'등록하지 못했어요');
    const sub=(g&&r.entryTime?'입차 '+esc(String(r.entryTime).slice(11,16)):'')+(r.dryRun?' · 시험 모드':'');
    return '<li><span class="dot '+(g?'ok':c?'pick':'no')+'"></span><span class="num">'+esc(r.plate||r.input)+'</span><span class="txt">'+esc(t)+(sub?'<small>'+sub+'</small>':'')+(c?'<span class="picks">'+r.choices.map(x=>'<button data-pick="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</span>':'')+'</span></li>'}).join('');
  $('#app').innerHTML=BRAND+'<section class="hello" style="margin:22px 0 14px"></section><section class="sheet result"><div class="badge'+(ok?'':' warn')+'">'+(ok?CHECK:BANG)+'</div><h2>'+head+'</h2><p class="lead">'+lead+'</p><ul class="rows">'+rows+'</ul><button class="again" id="again">← 다시 등록하기</button></section>';
  document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{form();go([b.dataset.pick])});
  $('#again').onclick=form;
  if(navigator.vibrate&&ok)navigator.vibrate(30);
}
load();
</script></body></html>
